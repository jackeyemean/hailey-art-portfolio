# Started by the admin's "Sync Preview" button. Runs the sync script against the database and
# pushes the result to the `preview` branch, which Vercel builds as a preview of the site.
# The admin's "Sync Live" button then moves `main` to that exact commit.
name: Sync preview

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-preview
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: data-extraction-script/package-lock.json

      - name: Install the sync script
        working-directory: data-extraction-script
        run: npm ci

      - name: Sync from the database
        working-directory: data-extraction-script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run extract-supabase

      - name: Push to the preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B preview
          git add -A static-site/public/data
          git commit --allow-empty -m "Sync preview (run ${{ github.run_id }})"
          git push --force origin preview
